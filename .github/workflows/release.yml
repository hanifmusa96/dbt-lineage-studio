name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Tag of the Release Please draft release
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Validate release version
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          node -e 'const fs = require("node:fs"); const version = require("./package.json").version; const tauri = require("./src-tauri/tauri.conf.json").version; const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1]; if (process.env.TAG_NAME !== `v${version}` || tauri !== version || cargo !== version) { console.error("Tag, package.json, tauri.conf.json and Cargo.toml versions must match."); process.exit(1); }'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - name: Build installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
        env:
          APPLE_SIGNING_IDENTITY: '-'
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
      - name: Create draft release for a manually pushed tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" installers/*/* --draft --verify-tag --title "Lineage Studio $TAG_NAME" --generate-notes --notes "Unsigned installers. macOS builds are ad-hoc signed, not notarized; Windows builds are unsigned."
      - name: Upload installers to the Release Please draft
        if: github.event_name == 'workflow_call'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          warning="Unsigned installers. macOS builds are ad-hoc signed, not notarized; Windows builds are unsigned."
          notes="$(gh release view "$TAG_NAME" --json body --jq .body)"
          if [[ "$notes" != *"$warning"* ]]; then
            gh release edit "$TAG_NAME" --notes "${notes}"$'\n\n'"${warning}"
          fi
          gh release upload "$TAG_NAME" installers/*/* --clobber
